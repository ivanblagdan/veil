[package]
name = "veil-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Local command-line tool for reversible sensitive-text replacement"
license-file = "LICENSE"

[[bin]]
name = "veil"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
fancy-regex = "0.17"
regex = "1"
unicode_categories = "0.1"
unicode-segmentation = "1"
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "api-21"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "raw_value"] }
getrandom = "0.3"
sha2 = "0.10"
tokenizers = { version = "=0.23.2", default-features = false, features = ["fancy-regex"] }

[dev-dependencies]
tempfile = "3"
